<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 700">
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;600;700&amp;display=swap');
    * { font-family: 'Noto Sans SC', 'PingFang SC', sans-serif; }
  </style>
  <rect width="1000" height="700" fill="#f5f6fa"/>
  
  <rect x="0" y="0" width="220" height="700" fill="#fff" stroke="#e8e8e8" stroke-width="1"/>
  <rect x="0" y="0" width="220" height="42" fill="#fafafa"/>
  <text x="16" y="26" fill="#333" font-size="13" font-weight="600">异常事件管理</text>
  
  <text x="36" y="58" fill="#666" font-size="12">▶ 概览</text>
  <text x="36" y="88" fill="#666" font-size="12">▶ 事件列表</text>
  
  <text x="36" y="118" fill="#1890ff" font-size="12" font-weight="500">▼ 日志追踪</text>
  <rect x="0" y="130" width="220" height="28" fill="#e6f7ff"/>
  <text x="52" y="148" fill="#1890ff" font-size="12" font-weight="500">├ 追踪任务管理</text>
  
  <text x="36" y="178" fill="#666" font-size="12">▶ 检测规则</text>
  <text x="36" y="208" fill="#666" font-size="12">▶ 转告警规则</text>
  
  <!-- Breadcrumb -->
  <text x="240" y="26" fill="#999" font-size="12">异常事件管理 / 日志追踪</text>
  
  <!-- Page header -->
  <text x="240" y="56" fill="#333" font-size="16" font-weight="600">日志追踪任务管理</text>
  
  <!-- Filter bar -->
  <rect x="240" y="70" width="748" height="60" rx="4" fill="#fff" stroke="#e8e8e8" stroke-width="1"/>
  
  <text x="260" y="92" fill="#666" font-size="11">任务类型</text>
  <rect x="310" y="80" width="100" height="22" rx="3" fill="#fafafa" stroke="#d9d9d9" stroke-width="1"/>
  <text x="360" y="95" fill="#666" font-size="10" text-anchor="middle">全部 ▼</text>
  
  <text x="430" y="92" fill="#666" font-size="11">任务状态</text>
  <rect x="480" y="80" width="100" height="22" rx="3" fill="#fafafa" stroke="#d9d9d9" stroke-width="1"/>
  <text x="530" y="95" fill="#666" font-size="10" text-anchor="middle">全部 ▼</text>
  
  <text x="600" y="92" fill="#666" font-size="11">时间范围</text>
  <rect x="650" y="80" width="120" height="22" rx="3" fill="#fafafa" stroke="#d9d9d9" stroke-width="1"/>
  <text x="710" y="95" fill="#666" font-size="10" text-anchor="middle">近7天 ▼</text>
  
  <rect x="790" y="80" width="60" height="24" rx="3" fill="#1890ff"/>
  <text x="820" y="95" fill="#fff" font-size="11" text-anchor="middle">查询</text>
  <rect x="856" y="80" width="60" height="24" rx="3" fill="#fff" stroke="#d9d9d9" stroke-width="1"/>
  <text x="886" y="95" fill="#666" font-size="11" text-anchor="middle">重置</text>
  
  <rect x="800" y="150" width="100" height="24" rx="3" fill="#1890ff"/>
  <text x="850" y="165" fill="#fff" font-size="11" text-anchor="middle">+ 创建实时追踪</text>
  <rect x="910" y="150" width="100" height="24" rx="3" fill="#1890ff"/>
  <text x="960" y="165" fill="#fff" font-size="11" text-anchor="middle">+ 创建事件追踪</text>
  
  <!-- Table header -->
  <rect x="240" y="186" width="748" height="32" fill="#fafafa" stroke="#e8e8e8" stroke-width="1"/>
  <rect x="240" y="188" width="30" height="28" fill="none"/>
  <text x="255" y="206" fill="#999" font-size="10">□</text>
  <text x="280" y="206" fill="#666" font-size="11">任务类型</text>
  <text x="370" y="206" fill="#666" font-size="11">任务状态</text>
  <text x="460" y="206" fill="#666" font-size="11">资源名称</text>
  <text x="570" y="206" fill="#666" font-size="11">资源类型</text>
  <text x="670" y="206" fill="#666" font-size="11">日志文件路径</text>
  <text x="820" y="206" fill="#666" font-size="11">结果行数</text>
  <text x="900" y="206" fill="#666" font-size="11">操作</text>
  
  <!-- Table rows -->
  <g font-size="11" fill="#333">
    <rect x="240" y="218" width="748" height="36" fill="#fff" stroke="#f0f0f0" stroke-width="1"/>
    <text x="255" y="240" fill="#999">□</text>
    <rect x="280" y="228" width="60" height="16" rx="2" fill="#1890ff"/>
    <text x="310" y="240" fill="#fff" font-size="10" text-anchor="middle">事件追踪</text>
    <rect x="370" y="228" width="40" height="16" rx="2" fill="#52c41a"/>
    <text x="390" y="240" fill="#fff" font-size="10" text-anchor="middle">已完成</text>
    <text x="460" y="240">gaussdb-01</text>
    <text x="570" y="240">GaussDB 实例</text>
    <text x="670" y="240" fill="#999">/var/log/gaussdb/gaussdb.log</text>
    <text x="820" y="240">128 行</text>
    <text x="900" y="240" fill="#1890ff">查看结果</text>
    
    <rect x="240" y="254" width="748" height="36" fill="#fafafa" stroke="#f0f0f0" stroke-width="1"/>
    <text x="255" y="276" fill="#999">□</text>
    <rect x="280" y="264" width="60" height="16" rx="2" fill="#1890ff"/>
    <text x="310" y="276" fill="#fff" font-size="10" text-anchor="middle">事件追踪</text>
    <rect x="370" y="264" width="60" height="16" rx="2" fill="#ff4d4f"/>
    <text x="400" y="276" fill="#fff" font-size="10" text-anchor="middle">日志不存在</text>
    <text x="460" y="276">rds-mysql-01</text>
    <text x="570" y="276">RDS 实例</text>
    <text x="670" y="276" fill="#999">/data/logs/mysql/slow.log</text>
    <text x="820" y="276">-</text>
    <text x="900" y="276" fill="#999">查看结果</text>
    
    <rect x="240" y="290" width="748" height="36" fill="#fff" stroke="#f0f0f0" stroke-width="1"/>
    <text x="255" y="312" fill="#999">□</text>
    <rect x="280" y="300" width="60" height="16" rx="2" fill="#52c41a"/>
    <text x="310" y="312" fill="#fff" font-size="10" text-anchor="middle">实时追踪</text>
    <rect x="370" y="300" width="40" height="16" rx="2" fill="#999"/>
    <text x="390" y="312" fill="#fff" font-size="10" text-anchor="middle">已停止</text>
    <text x="460" y="312">ecs-app-01</text>
    <text x="570" y="312">虚拟机</text>
    <text x="670" y="312" fill="#999">/opt/app/logs/app.log</text>
    <text x="820" y="312">67 行</text>
    <text x="900" y="312" fill="#1890ff">查看结果</text>
    
    <rect x="240" y="326" width="748" height="36" fill="#fafafa" stroke="#f0f0f0" stroke-width="1"/>
    <text x="255" y="348" fill="#999">□</text>
    <rect x="280" y="336" width="60" height="16" rx="2" fill="#1890ff"/>
    <text x="310" y="348" fill="#fff" font-size="10" text-anchor="middle">事件追踪</text>
    <rect x="370" y="336" width="40" height="16" rx="2" fill="#1890ff"/>
    <text x="390" y="348" fill="#fff" font-size="10" text-anchor="middle">执行中</text>
    <text x="460" y="348">gaussdb-02</text>
    <text x="570" y="348">GaussDB 实例</text>
    <text x="670" y="348" fill="#999">/var/log/gaussdb/audit.log</text>
    <text x="820" y="348">-</text>
    <text x="900" y="348" fill="#1890ff">查看结果 停止</text>
    
    <rect x="240" y="362" width="748" height="36" fill="#fff" stroke="#f0f0f0" stroke-width="1"/>
    <text x="255" y="384" fill="#999">□</text>
    <rect x="280" y="372" width="60" height="16" rx="2" fill="#52c41a"/>
    <text x="310" y="384" fill="#fff" font-size="10" text-anchor="middle">实时追踪</text>
    <rect x="370" y="372" width="40" height="16" rx="2" fill="#1890ff"/>
    <text x="390" y="384" fill="#fff" font-size="10" text-anchor="middle">执行中</text>
    <text x="460" y="384">oc-service-01</text>
    <text x="570" y="384">微服务</text>
    <text x="670" y="384" fill="#999">/home/oc/logs/service.log</text>
    <text x="820" y="384">-</text>
    <text x="900" y="384" fill="#1890ff">查看结果 停止</text>
  </g>
  
  <text x="900" y="660" fill="#ccc" font-size="10" text-anchor="end">页面五：日志追踪任务管理</text>
</svg>