<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 700">
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;600;700&amp;display=swap');
    * { font-family: 'Noto Sans SC', 'PingFang SC', sans-serif; }
  </style>
  <rect width="1000" height="700" fill="#f5f6fa"/>
  
  <text x="24" y="30" fill="#333" font-size="16" font-weight="600">弹窗组件一览</text>
  
  <!-- Modal 1: Event Detail -->
  <rect x="24" y="50" width="460" height="620" rx="6" fill="#fff" stroke="#d9d9d9" stroke-width="1"/>
  <rect x="24" y="50" width="460" height="40" rx="6" fill="#fafafa" stroke="#d9d9d9" stroke-width="1"/>
  <text x="44" y="76" fill="#333" font-size="14" font-weight="600">事件详情</text>
  <text x="440" y="76" fill="#999" font-size="14">✕</text>
  
  <!-- Section 1: Basic info -->
  <text x="44" y="106" fill="#666" font-size="12" font-weight="600">基本信息</text>
  <text x="44" y="126" fill="#999" font-size="10">事件 ID：</text><text x="100" y="126" fill="#333" font-size="10">EVT-20260812-001</text>
  <text x="240" y="126" fill="#999" font-size="10">事件级别：</text>
  <rect x="300" y="116" width="36" height="16" rx="2" fill="#ff4d4f"/>
  <text x="318" y="128" fill="#fff" font-size="9" text-anchor="middle">紧急</text>
  <text x="44" y="146" fill="#999" font-size="10">事件来源：</text><text x="100" y="146" fill="#333" font-size="10">运行日志</text>
  <text x="240" y="146" fill="#999" font-size="10">规则名称：</text><text x="300" y="146" fill="#1890ff" font-size="10">GaussDB OOM 检测</text>
  <text x="44" y="166" fill="#999" font-size="10">处理状态：</text>
  <rect x="100" y="156" width="36" height="16" rx="2" fill="#fa8c16"/>
  <text x="118" y="168" fill="#fff" font-size="9" text-anchor="middle">未处理</text>
  <text x="240" y="166" fill="#999" font-size="10">事件时间：</text><text x="300" y="166" fill="#333" font-size="10">2026-08-12 14:23:40</text>
  <text x="44" y="186" fill="#999" font-size="10">采集时间：</text><text x="100" y="186" fill="#333" font-size="10">2026-08-12 14:23:41</text>
  
  <!-- Section 2: Ownership -->
  <text x="44" y="216" fill="#666" font-size="12" font-weight="600">归属信息</text>
  <text x="44" y="236" fill="#999" font-size="10">资源类型：</text><text x="100" y="236" fill="#333" font-size="10">GaussDB 实例</text>
  <text x="240" y="236" fill="#999" font-size="10">资源子类型：</text><text x="300" y="236" fill="#333" font-size="10">GaussDB</text>
  <text x="44" y="256" fill="#999" font-size="10">资源名称：</text><text x="100" y="256" fill="#333" font-size="10">gaussdb-01</text>
  <text x="240" y="256" fill="#999" font-size="10">资源 ID：</text><text x="300" y="256" fill="#333" font-size="10">gaussdb-prod-001</text>
  <text x="44" y="276" fill="#999" font-size="10">日志文件路径：</text><text x="100" y="276" fill="#333" font-size="10">/var/log/gaussdb/gaussdb.log</text>
  <text x="44" y="296" fill="#999" font-size="10">日志行号：</text><text x="100" y="296" fill="#333" font-size="10">128</text>
  <text x="240" y="296" fill="#999" font-size="10">来源主机名：</text><text x="300" y="296" fill="#333" font-size="10">gaussdb-01</text>
  <text x="44" y="316" fill="#999" font-size="10">来源主机 IP：</text><text x="100" y="316" fill="#333" font-size="10">192.168.1.100</text>
  
  <!-- Section 3: Raw log -->
  <text x="44" y="346" fill="#666" font-size="12" font-weight="600">原始日志内容</text>
  <rect x="44" y="356" width="420" height="60" rx="4" fill="#1e1e1e"/>
  <text x="64" y="374" fill="#d4d4d4" font-family="monospace" font-size="10">2026-08-12 14:23:40 ERROR [worker-1]</text>
  <text x="64" y="390" fill="#d4d4d4" font-family="monospace" font-size="10">OutOfMemoryError: Java heap space</text>
  <text x="64" y="406" fill="#d4d4d4" font-family="monospace" font-size="10">  at com.gaussdb.core.MemoryPool.allocate</text>
  
  <!-- Section 4: Related trace tasks -->
  <text x="44" y="436" fill="#666" font-size="12" font-weight="600">关联追踪任务</text>
  <text x="44" y="456" fill="#999" font-size="10">暂无关联的追踪任务</text>
  
  <!-- Action buttons -->
  <rect x="44" y="480" width="80" height="24" rx="3" fill="#1890ff"/>
  <text x="84" y="496" fill="#fff" font-size="11" text-anchor="middle">标记已处理</text>
  <rect x="130" y="480" width="80" height="24" rx="3" fill="#fff" stroke="#d9d9d9" stroke-width="1"/>
  <text x="170" y="496" fill="#666" font-size="11" text-anchor="middle">标记已忽略</text>
  <rect x="216" y="480" width="80" height="24" rx="3" fill="#fff" stroke="#d9d9d9" stroke-width="1"/>
  <text x="256" y="496" fill="#666" font-size="11" text-anchor="middle">日志追踪</text>
  
  <!-- Bottom bar -->
  <line x1="24" y1="520" x2="484" y2="520" stroke="#f0f0f0" stroke-width="1"/>
  <rect x="380" y="530" width="80" height="28" rx="3" fill="#1890ff"/>
  <text x="420" y="549" fill="#fff" font-size="12" text-anchor="middle">日志追踪</text>
  <rect x="290" y="530" width="80" height="28" rx="3" fill="#fff" stroke="#d9d9d9" stroke-width="1"/>
  <text x="330" y="549" fill="#666" font-size="12" text-anchor="middle">关闭</text>
  
  <!-- Modal 2: Create Rule -->
  <rect x="510" y="50" width="460" height="620" rx="6" fill="#fff" stroke="#d9d9d9" stroke-width="1"/>
  <rect x="510" y="50" width="460" height="40" rx="6" fill="#fafafa" stroke="#d9d9d9" stroke-width="1"/>
  <text x="530" y="76" fill="#333" font-size="14" font-weight="600">新建检测规则</text>
  <text x="926" y="76" fill="#999" font-size="14">✕</text>
  
  <!-- Form fields -->
  <text x="530" y="106" fill="#666" font-size="11">事件来源 *</text>
  <rect x="530" y="112" width="200" height="28" rx="3" fill="#fafafa" stroke="#d9d9d9" stroke-width="1"/>
  <text x="630" y="131" fill="#666" font-size="11" text-anchor="middle">运行日志 ▼</text>
  
  <text x="530" y="156" fill="#666" font-size="11">采集模板 *</text>
  <rect x="530" y="162" width="200" height="28" rx="3" fill="#fafafa" stroke="#d9d9d9" stroke-width="1"/>
  <text x="630" y="181" fill="#666" font-size="11" text-anchor="middle">GaussDB 日志采集模板 ▼</text>
  
  <text x="530" y="206" fill="#666" font-size="11">规则名称 *</text>
  <rect x="530" y="212" width="420" height="28" rx="3" fill="#fafafa" stroke="#d9d9d9" stroke-width="1"/>
  <text x="740" y="231" fill="#bbb" font-size="11" text-anchor="middle">请输入规则名称</text>
  
  <text x="530" y="256" fill="#666" font-size="11">事件级别 *</text>
  <rect x="530" y="262" width="200" height="28" rx="3" fill="#fafafa" stroke="#d9d9d9" stroke-width="1"/>
  <text x="630" y="281" fill="#666" font-size="11" text-anchor="middle">紧急 ▼</text>
  
  <!-- Condition editor -->
  <text x="530" y="316" fill="#666" font-size="11" font-weight="600">检测条件 *</text>
  
  <!-- Condition row 1 -->
  <rect x="530" y="326" width="420" height="32" rx="3" fill="#fafafa" stroke="#d9d9d9" stroke-width="1"/>
  <rect x="540" y="332" width="80" height="20" rx="3" fill="#fff" stroke="#d9d9d9" stroke-width="1"/>
  <text x="580" y="346" fill="#666" font-size="10" text-anchor="middle">日志内容 ▼</text>
  <rect x="626" y="332" width="60" height="20" rx="3" fill="#fff" stroke="#d9d9d9" stroke-width="1"/>
  <text x="656" y="346" fill="#666" font-size="10" text-anchor="middle">包含 ▼</text>
  <rect x="692" y="332" width="120" height="20" rx="3" fill="#fff" stroke="#d9d9d9" stroke-width="1"/>
  <text x="752" y="346" fill="#bbb" font-size="10" text-anchor="middle">输入值...</text>
  <text x="830" y="346" fill="#999" font-size="10">Aa</text>
  <text x="850" y="346" fill="#999" font-size="10">区分大小写</text>
  <text x="930" y="346" fill="#ff4d4f" font-size="12">✕</text>
  
  <!-- AND connector -->
  <text x="550" y="376" fill="#1890ff" font-size="11" font-weight="600">AND</text>
  
  <!-- Condition row 2 -->
  <rect x="530" y="386" width="420" height="32" rx="3" fill="#fafafa" stroke="#d9d9d9" stroke-width="1"/>
  <rect x="540" y="392" width="80" height="20" rx="3" fill="#fff" stroke="#d9d9d9" stroke-width="1"/>
  <text x="580" y="406" fill="#666" font-size="10" text-anchor="middle">日志级别 ▼</text>
  <rect x="626" y="392" width="60" height="20" rx="3" fill="#fff" stroke="#d9d9d9" stroke-width="1"/>
  <text x="656" y="406" fill="#666" font-size="10" text-anchor="middle">等于 ▼</text>
  <rect x="692" y="392" width="120" height="20" rx="3" fill="#fff" stroke="#d9d9d9" stroke-width="1"/>
  <text x="752" y="406" fill="#666" font-size="10" text-anchor="middle">ERROR</text>
  <text x="930" y="406" fill="#ff4d4f" font-size="12">✕</text>
  
  <!-- Add condition button -->
  <rect x="530" y="428" width="100" height="24" rx="3" fill="#fff" stroke="#1890ff" stroke-width="1"/>
  <text x="580" y="444" fill="#1890ff" font-size="11" text-anchor="middle">+ 添加条件</text>
  
  <!-- JSON preview -->
  <text x="530" y="470" fill="#666" font-size="11">JSON 预览</text>
  <rect x="530" y="476" width="420" height="60" rx="4" fill="#1e1e1e"/>
  <text x="546" y="494" fill="#6a9955" font-family="monospace" font-size="9">{</text>
  <text x="546" y="508" fill="#6a9955" font-family="monospace" font-size="9">  "field": "logContent", "op": "contains", "value": "OOM"</text>
  <text x="546" y="522" fill="#6a9955" font-family="monospace" font-size="9">  "field": "level", "op": "equals", "value": "ERROR"</text>
  <text x="546" y="536" fill="#6a9955" font-family="monospace" font-size="9">}</text>
  
  <!-- Description -->
  <text x="530" y="556" fill="#666" font-size="11">描述</text>
  <rect x="530" y="562" width="420" height="40" rx="3" fill="#fafafa" stroke="#d9d9d9" stroke-width="1"/>
  <text x="546" y="580" fill="#bbb" font-size="11">请输入描述信息...</text>
  
  <!-- Bottom bar -->
  <line x1="510" y1="612" x2="970" y2="612" stroke="#f0f0f0" stroke-width="1"/>
  <rect x="850" y="622" width="80" height="28" rx="3" fill="#1890ff"/>
  <text x="890" y="641" fill="#fff" font-size="12" text-anchor="middle">保存</text>
  <rect x="760" y="622" width="80" height="28" rx="3" fill="#fff" stroke="#d9d9d9" stroke-width="1"/>
  <text x="800" y="641" fill="#666" font-size="12" text-anchor="middle">取消</text>
  
  <text x="24" y="690" fill="#999" font-size="10">左：事件详情弹窗 | 右：新建检测规则弹窗（含条件编辑器）</text>
</svg>