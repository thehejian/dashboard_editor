<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 700">
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;600;700&amp;display=swap');
    * { font-family: 'Noto Sans SC', 'PingFang SC', sans-serif; }
  </style>
  <rect width="1000" height="700" fill="#f5f6fa"/>
  
  <rect x="0" y="0" width="220" height="700" fill="#fff" stroke="#e8e8e8" stroke-width="1"/>
  <rect x="0" y="0" width="220" height="42" fill="#fafafa"/>
  <text x="16" y="26" fill="#333" font-size="13" font-weight="600">异常事件管理</text>
  
  <text x="36" y="58" fill="#666" font-size="12">▶ 概览</text>
  <text x="36" y="88" fill="#666" font-size="12">▶ 事件列表</text>
  
  <text x="36" y="118" fill="#1890ff" font-size="12" font-weight="500">▼ 日志追踪</text>
  <rect x="0" y="130" width="220" height="28" fill="#e6f7ff"/>
  <text x="52" y="148" fill="#1890ff" font-size="12" font-weight="500">├ 追踪任务管理</text>
  
  <text x="36" y="178" fill="#666" font-size="12">▶ 检测规则</text>
  <text x="36" y="208" fill="#666" font-size="12">▶ 转告警规则</text>
  
  <!-- Breadcrumb -->
  <text x="240" y="26" fill="#999" font-size="12">异常事件管理 / 日志追踪 / 追踪结果</text>
  
  <!-- Page header -->
  <text x="240" y="56" fill="#333" font-size="16" font-weight="600">追踪结果 - TRC-20260812-001</text>
  <rect x="510" y="42" width="60" height="24" rx="3" fill="#fff" stroke="#d9d9d9" stroke-width="1"/>
  <text x="540" y="58" fill="#666" font-size="11" text-anchor="middle">← 返回</text>
  
  <!-- Task info card -->
  <rect x="240" y="76" width="748" height="100" rx="4" fill="#fff" stroke="#e8e8e8" stroke-width="1"/>
  <text x="260" y="96" fill="#666" font-size="12" font-weight="600">任务信息</text>
  
  <!-- Grid layout of task info -->
  <text x="260" y="116" fill="#999" font-size="11">任务类型：</text><text x="320" y="116" fill="#333" font-size="11">事件追踪</text>
  <text x="420" y="116" fill="#999" font-size="11">任务状态：</text>
  <rect x="480" y="106" width="40" height="16" rx="2" fill="#52c41a"/>
  <text x="500" y="118" fill="#fff" font-size="10" text-anchor="middle">已完成</text>
  <text x="560" y="116" fill="#999" font-size="11">资源名称：</text><text x="620" y="116" fill="#333" font-size="11">gaussdb-01</text>
  
  <text x="260" y="136" fill="#999" font-size="11">资源类型：</text><text x="320" y="136" fill="#333" font-size="11">GaussDB 实例</text>
  <text x="420" y="136" fill="#999" font-size="11">日志文件路径：</text><text x="500" y="136" fill="#333" font-size="11">/var/log/gaussdb/gaussdb.log</text>
  
  <text x="260" y="156" fill="#999" font-size="11">来源主机：</text><text x="320" y="156" fill="#333" font-size="11">gaussdb-01 / 192.168.1.100</text>
  <text x="560" y="156" fill="#999" font-size="11">结果行数：</text><text x="620" y="156" fill="#333" font-size="11">128 行</text>
  <text x="720" y="156" fill="#999" font-size="11">创建时间：</text><text x="780" y="156" fill="#333" font-size="11">2026-08-12 14:25:00</text>
  
  <!-- Log content area -->
  <rect x="240" y="190" width="748" height="30" rx="4" fill="#fafafa" stroke="#e8e8e8" stroke-width="1"/>
  <text x="260" y="210" fill="#333" font-size="12" font-weight="600">追踪日志内容</text>
  <text x="900" y="210" fill="#999" font-size="11">共 128 行</text>
  
  <!-- Code block -->
  <rect x="240" y="220" width="748" height="340" rx="0" fill="#1e1e1e"/>
  
  <g font-family="monospace" font-size="11" fill="#d4d4d4">
    <text x="260" y="242" fill="#858585">  1</text>
    <text x="290" y="242">2026-08-12 14:23:10 INFO  [main] Starting GaussDB instance...</text>
    <text x="260" y="262" fill="#858585">  2</text>
    <text x="290" y="262">2026-08-12 14:23:15 INFO  [main] Connection pool initialized</text>
    <text x="260" y="282" fill="#858585">  3</text>
    <text x="290" y="282">2026-08-12 14:23:20 INFO  [scheduler] Health check passed</text>
    <text x="260" y="302" fill="#858585">  4</text>
    <text x="290" y="302">2026-08-12 14:23:25 INFO  [worker-1] Processing task #8921</text>
    <text x="260" y="322" fill="#858585">  5</text>
    <text x="290" y="322">2026-08-12 14:23:30 DEBUG [worker-1] Memory usage: 78%</text>
    <text x="260" y="342" fill="#858585">  6</text>
    <text x="290" y="342">2026-08-12 14:23:35 INFO  [worker-2] Processing task #8922</text>
  </g>
  
  <!-- Event highlight row -->
  <rect x="246" y="350" width="736" height="24" fill="rgba(255,77,79,0.1)" stroke="#ff4d4f" stroke-width="1"/>
  <g font-family="monospace" font-size="11">
    <text x="260" y="366" fill="#858585">  7</text>
    <text x="290" y="366" fill="#ff4d4f">2026-08-12 14:23:40 ERROR [worker-1] OutOfMemoryError: Java heap space</text>
    <rect x="780" y="352" width="48" height="16" rx="2" fill="#ff4d4f"/>
    <text x="804" y="364" fill="#fff" font-size="10" text-anchor="middle">事件行</text>
  </g>
  
  <g font-family="monospace" font-size="11" fill="#d4d4d4">
    <text x="260" y="386" fill="#858585">  8</text>
    <text x="290" y="386">2026-08-12 14:23:45 ERROR [worker-1] Unable to allocate new object</text>
    <text x="260" y="406" fill="#858585">  9</text>
    <text x="290" y="406">2026-08-12 14:23:50 INFO  [scheduler] Triggering OOM detection rule</text>
    <text x="260" y="426" fill="#858585"> 10</text>
    <text x="290" y="426">2026-08-12 14:23:55 WARN  [scheduler] Memory threshold exceeded</text>
    <text x="260" y="446" fill="#858585"> 11</text>
    <text x="290" y="446">2026-08-12 14:24:00 ALERT [monitor] Sending alarm notification</text>
    <text x="260" y="466" fill="#858585"> 12</text>
    <text x="290" y="466">2026-08-12 14:24:05 INFO  [monitor] Alarm sent to alert manager</text>
  </g>
  
  <text x="900" y="660" fill="#ccc" font-size="10" text-anchor="end">页面六：追踪结果查看</text>
</svg>