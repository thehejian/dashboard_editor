  <rect x="45" y="204" width="520" height="32" rx="4" fill="rgba(30,41,59,0.3)" stroke="#334155" stroke-width="0.5"/>
  <text x="65" y="225" fill="#e2e8f0" font-size="10">[P2] 库存服务扣减接口超时告警</text>

  <rect x="45" y="240" width="520" height="32" rx="4" fill="rgba(30,41,59,0.3)" stroke="#334155" stroke-width="0.5"/>
  <text x="65" y="261" fill="#e2e8f0" font-size="10">[P3] 推荐服务模型推理延迟升高</text>

