  <text x="65" y="355" fill="#fbbf24" font-size="11">⚠ 当前活动故障</text>
  <text x="400" y="355" fill="#60a5fa" font-size="9" text-anchor="end">前往故障中心 →</text>
  <line x1="45" y1="370" x2="565" y2="370" stroke="#1e293b" stroke-width="1"/>

  <rect x="65" y="380" width="480" height="24" rx="4" fill="rgba(30,41,59,0.3)" stroke="#334155" stroke-width="0.5"/>
