  <text x="760" y="608" fill="#a78bfa" font-size="9">关联故障</text>
  <text x="770" y="626" fill="#f1f5f9" font-size="13" font-weight="700">P1</text>
  <text x="795" y="626" fill="#94a3b8" font-size="8">1</text>
  <text x="820" y="626" fill="#f1f5f9" font-size="13" font-weight="700">P2</text>
  <text x="845" y="626" fill="#94a3b8" font-size="8">1</text>

